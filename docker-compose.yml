services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teampulse
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: teampulse
    ports:
      - "5432:5432"
    volumes:
      - teampulse_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  teampulse_pg:
